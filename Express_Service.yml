apiVersion: apps/v1
kind: Deployment
metadata:
  name: expressroute-monitor
  labels:
    app: expressroute-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expressroute-monitor
  template:
    metadata:
      labels:
        app: expressroute-monitor
    spec:
      serviceAccountName: monitoring
      containers:
      - name: expressroute-monitor
        image: myregistry.azurecr.io/expressroute-monitor:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: AZURE_SUBSCRIPTION_ID
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: subscriptionId
        - name: AZURE_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: tenantId
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: clientId
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: clientSecret
---
apiVersion: v1
kind: Service
metadata:
  name: expressroute-monitor-svc
spec:
  selector:
    app: expressroute-monitor
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP

